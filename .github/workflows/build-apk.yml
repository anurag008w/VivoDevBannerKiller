name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/VivoToolMaster.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VivoToolMaster-APK
          path: release-assets/VivoToolMaster.apk
          if-no-files-found: error
          retention-days: 30

      - name: Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.3-release' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Vivo ToolMaster v1.5.3' }}
          body: |
            ### 🚀 Vivo ToolMaster v1.5.3 (Interactive Hero Shield Orb, Modern Bento Grid & Floating Dock)

            #### ✨ What's New in v1.5.3:
            - **🛡️ Interactive Hero Shield Orb:** Large interactive central Power/Shield ring with pulse animation and haptic feedback on tap to instantly dismiss Vivo red banner!
            - **🍱 Modern Bento Grid:** Clean 2x2 modular tiles for Developer Options shortcut, Restore Menu toggle, Dev Mode live status, and USB Debugging state.
            - **🌊 Floating Dock Navigation:** Butter-smooth bottom pill navigation between Dev Banner Shield and Deep Cache Cleaner.
            - **💻 Clean ADB Dialog:** Interactive ADB verified command dialog with 1-tap copy without cluttering the screen.
            - **⚡ 100% Zero Feature Regression:** Developer Options (`development_settings_enabled = 1`), USB Debugging (`adb_enabled = 1`), and automated cache cleaning 100% INTACT!
            - **🛡️ Dual Auto & Manual Modes:**
              - **Auto Mode:** Automatically purges the banner on app launch, on device boot, and in background via NotificationListenerService.
              - **Manual 1-Tap Mode:** Tap "Kill Dev Banner Now" for instant 1-tap elimination.
            - **📋 1-Tap Copy ADB Command:** Quick copy button for `adb shell pm clear com.vivo.daemonService`.
            - **🛠️ Direct Open & Restore Developer Options:** Quick shortcuts to open Developer Options directly or restore it in Settings > More settings.
            - **🧹 Standalone Deep Cache Cleaner:** Clean gigabytes of app cache without Root and without Shizuku.
            - **🛑 0 MB RAM Mode:** Stop app process instantly to free memory when done.

            #### 📲 Download & Install:
            Download **`VivoToolMaster.apk`** attached below directly onto your phone and install!
          draft: false
          prerelease: false
          files: release-assets/VivoToolMaster.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
