name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/VivoToolMaster.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VivoToolMaster-APK
          path: release-assets/VivoToolMaster.apk
          if-no-files-found: error
          retention-days: 30

      - name: Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.6.0-release' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Vivo ToolMaster v1.6.0' }}
          body: |
            ### 🚀 Vivo ToolMaster v1.6.0 (App Guardian Unkillable Engine & Infinity Gestures Always-On)

            #### ✨ What's New in v1.6.0:
            - **⚡ App Guardian (Unkillable Apps Engine):**
              - Make **ANY** installed app unkillable by Vivo background killer, Android Doze, and App Standby!
              - **100% Reversible:** Toggle protection ON or OFF anytime with 1 tap.
              - Multi-layer defense: Android Doze Whitelist (`dumpsys deviceidle whitelist`), High-Priority Standby Bucket (`am set-standby-bucket active`), and Unrestricted Background Ops (`appops set RUN_IN_BACKGROUND allow`).
            - **♾️ Infinity Gestures Always-On Watchdog:**
              - Real-time `ContentObserver` 24/7 watchdog. If Vivo SystemUI unbinds or turns off Infinity Gestures accessibility service, ToolMaster automatically re-injects and revives it in milliseconds!
              - Screen unlock (`USER_PRESENT`) and boot auto-enforcement.
              - 1-tap `Force Re-bind Gestures Now` button.
            - **🧭 Sleek 3-Tab Floating Dock:**
              - `🛡️ Dev Shield` | `⚡ Guardian` | `🧹 Cleaner`
            - **🛡️ Dev Banner Killer & Deep Cache Cleaner 100% Intact:**
              - Dev Mode (`development_settings_enabled = 1`) and USB Debugging (`adb_enabled = 1`) stay 100% active and untouched.
            - **🛡️ Dual Auto & Manual Modes:**
              - **Auto Mode:** Automatically purges the banner on app launch, on device boot, and in background via NotificationListenerService.
              - **Manual 1-Tap Mode:** Tap "Kill Dev Banner Now" for instant 1-tap elimination.
            - **📋 1-Tap Copy ADB Command:** Quick copy button for `adb shell pm clear com.vivo.daemonService`.
            - **🛠️ Direct Open & Restore Developer Options:** Quick shortcuts to open Developer Options directly or restore it in Settings > More settings.
            - **🧹 Standalone Deep Cache Cleaner:** Clean gigabytes of app cache without Root and without Shizuku.
            - **🛑 0 MB RAM Mode:** Stop app process instantly to free memory when done.

            #### 📲 Download & Install:
            Download **`VivoToolMaster.apk`** attached below directly onto your phone and install!
          draft: false
          prerelease: false
          files: release-assets/VivoToolMaster.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
