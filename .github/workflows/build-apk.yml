name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/VivoToolMaster.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VivoToolMaster-APK
          path: release-assets/VivoToolMaster.apk
          if-no-files-found: error
          retention-days: 30

      - name: Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0-release' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Vivo ToolMaster v1.4.0' }}
          body: |
            ### 🚀 Vivo ToolMaster v1.4.0 (DevBanner Killer & Standalone Deep Cache Cleaner)

            #### ✨ What's New in v1.4.0:
            - **Developer Options Protection:** Fixed bug where Developer options was disappearing from Vivo's Settings. Now `vivo_development_show` is always kept safe!
            - **🛠️ Direct Open Developer Options:** 1-tap button to open Developer Options directly anytime.
            - **🔄 Restore Developer Mode:** 1-tap button to ensure Developer Options is visible in Settings > More settings.
            - **⚡ Dev Banner Killer:** Eliminates the annoying red status bar banner without turning off USB debugging or hiding developer options.
            - **🧹 Standalone Deep Cache Cleaner:** Batch automated cache cleaning for all or selected apps without Root and without Shizuku.
            - **🛑 0 MB RAM Mode:** Stop app process instantly to free memory.

            #### 📲 Download & Install:
            Download **`VivoToolMaster.apk`** attached below directly onto your phone and install!
          draft: false
          prerelease: false
          files: release-assets/VivoToolMaster.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
